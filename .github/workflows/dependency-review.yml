name: dependency-review
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@b4ffde65c0a73b1ba9d1b9a2cc2c84e34e8b5c8f
      - uses: actions/dependency-review-action@0efb4f626fd0a8a7cbae2a7b4b88c6ba1e9ce7f5
        with:
          fail-on-severity: high
